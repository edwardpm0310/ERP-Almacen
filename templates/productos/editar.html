{% extends 'base.html' %}
{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="container">
    <h2>Editar Producto</h2>
    <form method="POST" class="mt-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Código</label>
                <input type="text" name="codigo" value="{{ producto.codigo }}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3">{{ producto.descripcion }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Precio Compra (S/)</label>
                <input type="number" step="0.01" name="precio_compra" value="{{ producto.precio_compra }}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Precio Venta (S/)</label>
                <input type="number" step="0.01" name="precio_venta" value="{{ producto.precio_venta }}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Stock Actual</label>
                <input type="number" name="stock" value="{{ producto.stock }}" class="form-control" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Stock Mínimo</label>
                <input type="number" name="stock_minimo" value="{{ producto.stock_minimo }}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Proveedor</label>
                <select name="proveedor_id" class="form-control">
                    <option value="">Sin proveedor</option>
                    {% for prov in proveedores %}
                    <option value="{{ prov.id }}" {{ 'selected' if prov.id == producto.proveedor_id else '' }}>
                        {{ prov.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Actualizar Producto</button>
        <a href="{{ url_for('productos') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
