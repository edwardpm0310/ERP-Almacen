{% extends 'base.html' %}
{% block title %}Nueva Compra{% endblock %}

{% block content %}
<div class="container">
    <h2>🛒 Nueva Compra</h2>
    
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Proveedor</label>
            <select name="proveedor_id" class="form-control" required>
                <option value="">-- Seleccione Proveedor --</option>
                {% for p in proveedores %}
                <option value="{{ p.id }}">{{ p.nombre }} (RUC: {{ p.ruc }})</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Crear Compra</button>
        <a href="{{ url_for('compras') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
