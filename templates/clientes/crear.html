{% extends 'base.html' %}
{% block title %}Nuevo Cliente{% endblock %}

{% block content %}
<div class="container">
    <h2>Crear Nuevo Cliente</h2>
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label>Nombre Completo</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>DNI</label>
            <input type="text" name="dni" maxlength="8" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" name="telefono" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control">
        </div>
        <div class="mb-3">
            <label>Dirección</label>
            <textarea name="direccion" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
        <a href="{{ url_for('clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
