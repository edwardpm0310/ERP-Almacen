{% extends 'base.html' %}
{% block title %}Editar Proveedor{% endblock %}

{% block content %}
<div class="container">
    <h2>Editar Proveedor</h2>
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label>Nombre / Razón Social</label>
            <input type="text" name="nombre" value="{{ proveedor.nombre }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>RUC</label>
            <input type="text" name="ruc" value="{{ proveedor.ruc }}" class="form-control" maxlength="11" required>
        </div>
        <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" name="telefono" value="{{ proveedor.telefono }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" value="{{ proveedor.email }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Dirección</label>
            <textarea name="direccion" class="form-control" rows="3">{{ proveedor.direccion }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Actualizar Proveedor</button>
        <a href="{{ url_for('proveedores') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
